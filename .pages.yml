- name: blog
  label: Blog
  type: collection
  path: content/blog
  format: yaml-frontmatter
  filename:
    template: '{title}.md'
    field: false
  operations:
    rename: false
  view:
    fields:
    - title
    - date
    - category
    - published
    primary: title
    sort:
    - date
    - title
    search:
    - title
    - description
    - category
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Titel
    type: string
    required: true
  - name: description
    label: Kurzbeschreibung
    type: text
    required: true
    description: Wird auf der Blogübersicht und für Suchmaschinen verwendet.
  - name: date
    label: Veröffentlichungsdatum
    type: date
    required: true
    options:
      format: yyyy-MM-dd
  - name: published
    label: Veröffentlicht
    type: boolean
    default: true
  - name: category
    label: Kategorie
    type: select
    required: true
    default: Aktuelles
    options:
      values:
      - Aktuelles
      - IT-Infrastruktur
      - Managed Services
      - SAP
      - Datenschutz
      - KIS-Guard
  - name: image
    label: Beitragsbild
    type: image
    options:
      path: blog
      rename: true
  - name: imageAlt
    label: Bildbeschreibung
    type: string
    description: Kurze Beschreibung des Bildes für Barrierefreiheit und SEO.
  - name: body
    label: Artikelinhalt
    type: rich-text
    required: true
    options:
      format: markdown
      path: blog
      rename: true
      switcher: true
components:
  seo:
    type: object
    fields:
    - name: title
      label: Seitentitel
      type: string
      required: true
    - name: description
      label: Meta-Beschreibung
      type: text
      required: true
  process_steps:
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: title
      label: Überschrift
      type: string
      required: true
    - name: paragraphs
      label: Absätze
      list: true
      component: rich_text
  faq_items:
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{question}'
    fields:
    - name: question
      label: Frage
      type: string
      required: true
    - name: answer
      label: Antwort
      required: true
      component: rich_text
  hero:
    type: object
    fields:
    - name: eyebrow
      label: Dachzeile
      type: string
    - name: title
      label: Überschrift
      type: string
      required: true
    - name: description
      label: Einleitender Absatz (optional)
      component: rich_text
    - name: paragraphs
      label: Absätze
      list: true
      description: Ein Listeneintrag entspricht einem Absatz. Fett, Kursiv und Links sind möglich.
      component: rich_text
    - name: ctaLabel
      label: Button-Beschriftung
      type: string
    - name: image
      label: Bild
      type: image
    - name: imageAlt
      label: Bildbeschreibung
      type: string
  rich_text:
    type: rich-text
    options:
      format: html
      media: false
      switcher: true
  rich_paragraph:
    type: rich-text
    options:
      format: html
      media: false
      switcher: true
    description: Ein Absatz im bestehenden Layout. Weitere Absätze sind über Zeilenumbrüche im Editor möglich.
