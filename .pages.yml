content:
- name: home_page
  label: Startseite
  path: content/home/content.json
  type: file
  fields:
  - name: seo
    label: Suchmaschinen (SEO)
    component: seo
    required: true
  - name: carousel
    label: Karusell
    list: true
    type: object
    fields:
    - name: title1
      label: Titel1
      type: string
    - name: title2
      label: Titel2
      type: string
    - name: text
      label: Text
      type: string
    - name: background_image
      label: Hintergrundbild
      type: image
  - name: textwithcta
    label: Willkommenstext
    type: object
    fields:
    - name: title
      label: Titel
      type: string
    - name: text
      label: Text
      type: text
    - name: appointmentLabel
      label: 'Button: Termin vereinbaren'
      type: string
    - name: servicesLabel
      label: 'Button: Leistungen'
      type: string
    required: true
  - name: serviceoverview
    label: Serviceübersicht
    type: object
    fields:
    - name: title
      label: Titel
      type: string
    - name: services
      label: Dienstleistungen
      type: object
      list: true
      fields:
      - name: icon
        label: Symbol
        type: string
      - name: title
        label: Titel
        type: string
      - name: description
        label: Beschreibung
        type: text
    required: true
  - name: textimageleft
    label: Was zeichnet uns aus
    type: object
    fields:
    - name: title
      label: Titel
      type: string
    - name: text
      label: Text
      type: text
    - name: image
      label: Bild
      type: image
    - name: imagealt
      label: Bildbeschreibung
      type: string
    required: true
  - name: award
    label: Auszeichnung (Was zeichnet uns aus)
    type: object
    fields:
    - name: image
      label: Siegel
      type: image
    - name: imageAlt
      label: Bildbeschreibung
      type: string
    - name: caption
      label: Titel der Auszeichnung
      type: string
    - name: description
      label: Beschreibung
      type: text
    required: true
  - name: blogPreview
    label: Blogvorschau
    type: object
    fields:
    - name: eyebrow
      label: Dachzeile
      type: string
    - name: title
      label: Überschrift
      type: string
    - name: allLabel
      label: Link zur Übersicht
      type: string
    - name: readLabel
      label: Link zum Artikel
      type: string
    required: true
- name: aboutus_page
  label: Über uns Seite
  path: content/aboutus/content.json
  type: file
  fields:
  - name: seo
    label: Suchmaschinen (SEO)
    component: seo
    required: true
  - name: intro
    label: Einleitungstext mit Bild
    type: object
    fields:
    - name: title
      label: Titel
      type: string
    - name: subtitle
      label: Untertitel
      type: text
    - name: images
      label: Bilder
      type: object
      list:
        min: 3
        max: 3
        collapsible: true
      fields:
      - name: image
        label: Bild
        type: image
      - name: imagealt
        label: Bildbeschreibung
        type: string
      description: Das bestehende Layout zeigt genau drei Bilder.
    required: true
  - name: mission
    label: Unsere Mission
    type: object
    fields:
    - name: title
      label: Titel
      type: string
    - name: text
      label: Archivtext (bisher nicht angezeigt)
      type: rich-text
      readonly: true
      description: Bestehender, im alten Frontend nicht verwendeter Text. Die sichtbaren Texte stehen in den beiden Spalten
        unten.
    - name: leftBlocks
      label: Linke Spalte
      type: object
      fields:
      - name: title
        label: Überschrift
        type: string
      - name: text
        label: Text
        type: text
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
    - name: rightBlocks
      label: Rechte Spalte
      type: object
      fields:
      - name: title
        label: Überschrift
        type: string
      - name: text
        label: Text
        type: text
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
    required: true
  - name: breakImage
    label: Trennbild
    type: image
  - name: breakImageAlt
    label: 'Trennbild: Bildbeschreibung'
    type: string
  - name: gruende
    label: Gründe für unser Unternehmen
    type: object
    fields:
    - name: title
      label: Titel
      type: string
    - name: subtitle
      label: Untertitel
      type: string
    - name: gruende
      label: Gründe
      type: object
      list: true
      fields:
      - name: title
        label: Titel
        type: string
      - name: description
        label: Beschreibung
        type: text
    required: true
  - name: kooperationen
    label: Kooperationspartner
    type: object
    fields:
    - name: title
      label: Titel
      type: string
    - name: subtitle
      label: Untertitel
      type: string
    - name: partner
      label: Partner
      type: object
      list: true
      fields:
      - name: partnername
        label: Partnername
        type: string
      - name: description
        label: Beschreibung
        type: text
      - name: partnerimage
        label: Partnerlogo
        type: image
    description: Bestehende Daten; derzeit nicht im Frontend angezeigt.
    required: true
  - name: team
    label: Team
    type: object
    fields:
    - name: title
      label: Titel
      type: string
    - name: subtitle
      label: Untertitel
      type: string
    - name: persons
      label: Personen
      type: object
      list: true
      fields:
      - name: name
        label: Name
        type: string
      - name: position
        label: Position
        type: string
      - name: image
        label: Bild
        type: image
    required: true
- name: services
  label: Leistungen
  path: content/services/content.json
  type: file
  fields:
  - name: seo
    label: Suchmaschinen (SEO)
    component: seo
    required: true
  - name: sapSeo
    label: 'SAP-Übersicht: Suchmaschinen (SEO)'
    component: seo
    required: true
  - name: title
    label: Titel
    type: string
  - name: subtitle
    label: Untertitel
    type: string
  - name: services
    label: Leistungen
    type: object
    list: true
    fields:
    - name: name
      label: Routenkennung (bestehende Seite)
      type: string
      description: Technische Routenkennung. Bestehende Kennungen nicht ändern, außer die zugehörige Route wird ebenfalls
        im Code angepasst.
      required: true
    - name: title
      label: Titel
      type: string
    - name: subtitle
      label: Untertitel
      type: string
    - name: description
      label: Beschreibung
      type: text
    - name: image
      label: Bild
      type: image
    - name: imagealt
      label: Bildbeschreibung
      type: string
    - name: subservice
      label: Unterleistungen
      type: object
      list: true
      fields:
